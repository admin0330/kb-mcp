[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kb-mcp"
version = "0.3.1"
description = "A mount-tolerant, portable MCP server for external APFS knowledge base (hybrid retrieval + AI organize)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "KnowledgeBase MCP Author" }
]
keywords = ["mcp", "knowledge-base", "rag", "retrieval", "claude", "agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "mcp>=1.2.0,<2",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
semantic = [
    "fastembed>=0.3.0",
]

[project.scripts]
kb-mcp = "kb_mcp.kb_mcp_server:main"
kb-mcp-server = "kb_mcp.kb_mcp_server:main"
kb-files-gateway = "kb_mcp.fs_gateway:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_mcp"]
