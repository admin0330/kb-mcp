[project]
name = "kb-mcp-server"
version = "0.2.0"
description = "Mount-tolerant MCP server for an external APFS knowledge base (retrieval + index-aware file ops)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "numpy>=1.26.0",
]

# Optional semantic search (FastEmbed = ONNX, no PyTorch). Install with:
#   uv pip install -e ".[semantic]"
[project.optional-dependencies]
semantic = ["fastembed>=0.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["kb_mcp_server.py", "indexer.py", "extractors.py", "health.py", "fs_gateway.py", "placeholder_server.py"]
